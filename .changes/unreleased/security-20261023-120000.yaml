kind: security
body: 'Go toolchain 1.26.8 → 1.26.10 fixes CVE-2026-56857, a Critical Go standard library vulnerability on Windows; golang.org/x/net 0.59.0 → 0.60.0 fixes five HTTP/2 vulnerabilities that govulncheck found reachable. govulncheck now reports no reachable vulnerabilities.'
